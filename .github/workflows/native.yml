name: Native Minecraft packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: macos-x64, runner: macos-15-intel}
          - {target: macos-arm64, runner: macos-15}
          - {target: windows-x64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve exact Git fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-constellation
          ref: 8062eda22ea4fe9c333798be8397ce7fa4f6f2ee
          path: native-shared
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-constellation-instance
          ref: 39807674755dff153de372b3311e08a006ba7174
          path: instance-boundary-fixture
      - uses: actions/checkout@v4
        with:
          repository: microsoft/amplifier-constellation-instance
          ref: d77dc2d8794bcbfce7a0118d5fb1c01ff429ec18
          path: instance-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Match qualified Windows static CRT target
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYCODE'
          import os, subprocess
          host = next(line.removeprefix('host: ') for line in subprocess.check_output(['rustc', '+1.93.0', '-vV'], text=True).splitlines() if line.startswith('host: '))
          expected = {'X64': 'x86_64-pc-windows-msvc', 'ARM64': 'aarch64-pc-windows-msvc'}[os.environ['RUNNER_ARCH']]
          if host != expected: raise SystemExit(f'Unexpected Rust host: {host}; expected {expected}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARGO_BUILD_TARGET='+host+'\nRUSTFLAGS=-C target-feature=+crt-static\n')
          PYCODE
      - name: Build actual target shared driver
        shell: bash
        run: |
          cargo +1.93.0 build --release --locked --manifest-path native-shared/crates/native-platform-driver/Cargo.toml
      - name: Build shared disposable Windows service cleanup fixture
        if: runner.os == 'Windows'
        shell: bash
        run: cargo +1.93.0 build --release --locked --manifest-path native-shared/crates/native-platform/Cargo.toml --features installation --example windows_service_fixture
      - name: Bind and inspect actual native build outputs
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, sys
          shared=pathlib.Path('native-shared').resolve()
          target=pathlib.Path('target')/os.environ.get('CARGO_BUILD_TARGET','')/'release'
          suffix='.exe' if os.name=='nt' else ''
          driver=shared/'crates/native-platform-driver'/target/('constellation-native-driver'+suffix)
          subprocess.run([sys.executable,str(shared/'tests/native_python/inspect_driver.py'),'--driver',str(driver),'--output','native-driver-inspection.json'],check=True)
          library=driver.parent/{'Windows':'constellation_native_driver.dll','Darwin':'libconstellation_native_driver.dylib','Linux':'libconstellation_native_driver.so'}[platform.system()]
          subprocess.run([sys.executable,str(shared/'tests/native_python/inspect_library.py'),'--library',str(library),'--output','native-library-inspection.json'],check=True)
          digest=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          build={'source':subprocess.check_output(['git','rev-parse','HEAD'],cwd=shared,text=True).strip(),
                 'profile':'release','rustc':subprocess.check_output(['rustc','+1.93.0','-vV'],text=True),
                 'cargo_build_target':os.environ.get('CARGO_BUILD_TARGET'),'rustflags':os.environ.get('RUSTFLAGS',''),
                 'workflow_sha256':digest(pathlib.Path('.github/workflows/native.yml')),
                 'driver_sha256':digest(driver),'library_sha256':digest(library)}
          pathlib.Path('native-build-result.json').write_text(json.dumps(build,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('MINECRAFT_NATIVE_LIBRARY='+str(library)+'\n')
              output.write('MINECRAFT_NATIVE_DRIVER='+str(driver)+'\n')
              if os.name=='nt':
                  fixture=shared/'crates/native-platform'/target/'examples'/('windows_service_fixture'+suffix)
                  output.write('NATIVE_SERVICE_FIXTURE='+str(fixture)+'\n')
                  saved=pathlib.Path('qualification-fixtures');saved.mkdir()
                  shutil.copyfile(fixture,saved/fixture.name)
                  subprocess.run([sys.executable,str(shared/'tests/native_python/inspect_driver.py'),'--driver',str(saved/fixture.name),'--output',str(saved/'inspection.json')],check=True)
          PYCODE
      - name: Test package validation
        run: python -m unittest discover -s ops/native -p test_*.py -v
      - name: Build private native runtimes and dependencies (Unix)
        if: runner.os != 'Windows'
        run: python ops/native/build_bundle.py --output bundle --cache runtime-cache --native-shared native-shared --native-driver "${{ env.MINECRAFT_NATIVE_DRIVER }}" --native-library "${{ env.MINECRAFT_NATIVE_LIBRARY }}"
      - name: Build private native runtimes and dependencies (Windows)
        if: runner.os == 'Windows'
        run: python ops/native/build_bundle.py --output bundle --cache runtime-cache --native-shared native-shared --native-driver "${{ env.MINECRAFT_NATIVE_DRIVER }}" --native-library "${{ env.MINECRAFT_NATIVE_LIBRARY }}"
      - name: Qualify packaged release ABI (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_native_boundary.py --bundle bundle --shared native-shared --instance instance-boundary-fixture --receipt native-boundary-result.json
      - name: Qualify packaged release ABI (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_native_boundary.py --bundle bundle --shared native-shared --instance instance-boundary-fixture --receipt native-boundary-result.json
      - name: Prepare disposable Linux native service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install Linux browser OS libraries on disposable runner
        if: runner.os == 'Linux'
        run: bundle/node/bin/node bundle/app/node_modules/playwright/cli.js install-deps chromium
      - name: Verify actual Worker admission and gate ownership (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_worker.py --bundle bundle --source . --shared native-shared --instance instance-fixture --receipt native-worker-result.json
      - name: Verify actual Worker admission and gate ownership (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_worker.py --bundle bundle --source . --shared native-shared --instance instance-fixture --receipt native-worker-result.json
      - name: Verify latest Instance lifetime and enrollment (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_worker_lifetime.py --bundle bundle --source . --shared native-shared --instance instance-fixture --receipt native-worker-lifetime-result.json
      - name: Verify latest Instance lifetime and enrollment (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_worker_lifetime.py --bundle bundle --source . --shared native-shared --instance instance-fixture --receipt native-worker-lifetime-result.json
      - name: Verify detached Connect parity (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_connect.py --bundle bundle --source . --shared native-shared --instance instance-fixture --output native-connect-result
      - name: Verify detached Connect parity (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_connect.py --bundle bundle --source . --shared native-shared --instance instance-fixture --output native-connect-result
      - name: Verify captured-PIPE Connect parity (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_connect.py --bundle bundle --source . --shared native-shared --capture pipe --output native-connect-pipe-result
      - name: Verify captured-PIPE Connect parity (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_connect.py --bundle bundle --source . --shared native-shared --capture pipe --output native-connect-pipe-result
      - name: Verify actual native lifecycle and original session (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_lifecycle.py --bundle bundle --source . --shared native-shared --driver bundle/native/constellation-native-driver --receipt native-lifecycle-result.json
      - name: Verify actual native lifecycle and original session (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_lifecycle.py --bundle bundle --source . --shared native-shared --driver bundle/native/constellation-native-driver.exe --receipt native-lifecycle-result.json
      - name: Verify packaged native retention (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_retention.py --bundle bundle --driver bundle/native/constellation-native-driver --receipt native-retention-result.json
      - name: Verify packaged native retention (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_retention.py --bundle bundle --driver bundle/native/constellation-native-driver.exe --receipt native-retention-result.json
      - name: Verify packaged scoped tree recovery (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_tree_recovery.py --bundle bundle --driver bundle/native/constellation-native-driver --receipt native-tree-recovery-result.json
      - name: Verify packaged scoped tree recovery (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_tree_recovery.py --bundle bundle --driver bundle/native/constellation-native-driver.exe --receipt native-tree-recovery-result.json
      - name: Verify packaged client and browser (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_bundle.py --bundle bundle --source . --receipt native-result.json
      - name: Verify packaged client and browser (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_bundle.py --bundle bundle --source . --receipt native-result.json
      - name: Archive exact setup candidate
        run: python ops/native/archive_bundle.py --bundle bundle --output minecraft-${{ matrix.target }}.tar.gz
      - name: Verify fresh setup and full archive staging (Unix)
        if: runner.os != 'Windows'
        run: bundle/python/bin/python3 -I ops/native/verify_setup.py --bundle bundle --source . --shared native-shared --archive minecraft-${{ matrix.target }}.tar.gz --receipt native-setup-result.json
      - name: Verify fresh setup and full archive staging (Windows)
        if: runner.os == 'Windows'
        run: bundle/python/python.exe -I ops/native/verify_setup.py --bundle bundle --source . --shared native-shared --archive minecraft-${{ matrix.target }}.tar.gz --receipt native-setup-result.json
      - name: Verify packaged native pair remained exact
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib,json,pathlib
          path=pathlib.Path('native-build-result.json');build=json.loads(path.read_bytes())
          manifest=json.loads(pathlib.Path('bundle/manifest.json').read_bytes())
          assert manifest['native_platform']['source']==build['source']
          for role in ('driver','library'):
              actual=hashlib.sha256((pathlib.Path('bundle')/manifest['native_platform'][role]).read_bytes()).hexdigest()
              assert actual==manifest['native_platform'][role+'_sha256']==build[role+'_sha256']
          build['packaged_pair_unchanged_after_qualification']=True
          path.write_text(json.dumps(build,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-evidence-${{ matrix.target }}
          path: |
            native-driver-inspection.json
            native-build-result.json
            native-library-inspection.json
            native-boundary-result.json
            native-setup-result.json
            native-worker-result.json
            native-worker-lifetime-result.json
            native-connect-result/
            native-connect-pipe-result/
            native-retention-result.json
            native-tree-recovery-result.json
            native-lifecycle-result.json
            native-result.json
            native-screenshot-result/
            bundle/manifest.json
            bundle/python-packages.json
            qualification-fixtures/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-${{ matrix.target }}
          path: |
            minecraft-${{ matrix.target }}.tar.gz
            minecraft-${{ matrix.target }}.tar.gz.json
            native-driver-inspection.json
            native-build-result.json
            native-library-inspection.json
            native-boundary-result.json
            native-setup-result.json
            native-worker-result.json
            native-worker-lifetime-result.json
            native-connect-result/
            native-connect-pipe-result/
            native-retention-result.json
            native-tree-recovery-result.json
            native-lifecycle-result.json
            native-result.json
            native-screenshot-result/
            bundle/manifest.json
            qualification-fixtures/
          retention-days: 7
